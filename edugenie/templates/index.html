<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - Learning Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #4b4ded;
        }

        p {
            text-align: center;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #4b4ded;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3738c9;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f8;
            border-radius: 8px;
            min-height: 50px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📚 EduGenie</h1>
        <p>Your Learning Assistant</p>

        <textarea id="question"
            placeholder="Type your question here..."></textarea>

        <button onclick="askQuestion()">Ask EduGenie</button>
        <button onclick="clearchat()">clear</button
                  <div id="result">
            Answer will appear here...
        </div>
    </div>

    <script>
        async function askQuestion() {
                       clearchat()
            const question = document.getElementById("question").value;
            const result = document.getElementById("result");

            if (!question.trim()) {
                result.innerText = "Please enter a question.";
                return;
            }

            result.innerText = "Thinking...";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                if (data.answer) {
                    result.innerText = data.answer;
                } else {
                    result.innerText = JSON.stringify(data);
                }

            } catch (error) {
                result.innerText =
                    "Error connecting to EduGenie. Please check the server.";
            }
        }
    </script>

</body>
</html>
